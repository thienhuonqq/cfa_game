<title>Wall Street Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a trading-terminal shell — sticky status line, a city-block grid of districts, panels with hairline borders and square corners. Single dark look by design. */
:root{
  color-scheme: dark;
  --ink:#0A0E13;      /* ground */
  --deck:#111821;     /* panels */
  --deck-2:#17202B;   /* raised panels */
  --wire:#24313F;     /* hairlines */
  --paper:#DDE4EC;    /* text */
  --dim:#8494A6;      /* secondary text */
  --amber:#FFB020;    /* the one accent: terminal amber */
  --amber-ink:#1A1100;
  --amber-soft:rgba(255,176,32,.14);
  --bull:#3FD99A;     /* semantic: correct / gain */
  --bear:#FF6363;     /* semantic: wrong / loss */
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{background:var(--ink);color:var(--paper)}
body{font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--amber)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.amber{color:var(--amber)}
.bull{color:var(--bull)}.bear{color:var(--bear)}

/* status bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(10,14,19,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--wire)}
.bar-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;cursor:pointer;padding:0;line-height:1}
.brand b{color:var(--amber)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px;color:var(--dim);align-items:center}
.stats span b{color:var(--paper);font-weight:600}
.xpbar{width:120px;height:6px;background:var(--wire);display:inline-block;vertical-align:middle;margin-left:6px}
.xpbar i{display:block;height:100%;background:var(--amber)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}

.shell{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.btn{background:var(--deck-2);border:1px solid var(--wire);padding:7px 12px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.01em;border-radius:2px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.on{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:12px}

h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,9vw,104px);font-weight:900}
h2{font-size:clamp(30px,5vw,48px);font-weight:800}
h3{font-size:22px;font-weight:800}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
p{margin:0}
.lede{max-width:64ch;color:var(--paper);font-size:17px}
.narr{font-style:italic;color:var(--dim);max-width:64ch}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--deck);border:1px solid var(--wire);padding:18px;min-width:0}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1px solid var(--wire);color:var(--dim)}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.bull{border-color:var(--bull);color:var(--bull)}
.chip.bear{border-color:var(--bear);color:var(--bear)}

/* hub */
.hero{position:relative;padding-block:8px 18px;display:grid;gap:14px}
#sky{width:100%;height:120px;display:block;border-bottom:1px solid var(--wire)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:1px;background:var(--wire);border:1px solid var(--wire);margin-top:22px}
.tile{background:var(--deck);padding:16px;display:flex;flex-direction:column;gap:8px;min-height:178px;text-align:left;border:0;cursor:default;position:relative}
.tile .num{font-family:var(--display);font-weight:900;font-size:44px;line-height:.8;color:var(--wire)}
.tile .dname{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.tile .topic{font-size:13px;color:var(--dim)}
.tile .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.tile.live{cursor:pointer;background:linear-gradient(180deg,var(--amber-soft),transparent 70%),var(--deck)}
.tile.live .num{color:var(--amber)}
.tile.live:hover{outline:1px solid var(--amber);z-index:1}
.tile.locked .dname,.tile.locked .topic{opacity:.55}
.meter{display:flex;gap:3px}
.meter i{width:22px;height:5px;background:var(--wire)}
.meter i.on{background:var(--amber)}

/* district */
.dhead{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--wire)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--wire);margin-block:18px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;color:var(--dim);white-space:nowrap}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.tab .tick{font-family:var(--mono);font-size:11px;margin-left:6px;color:var(--bull)}
.grid2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.chapter h3{margin-bottom:10px}
.chapter p+p{margin-top:10px}
.try{border-left:2px solid var(--amber);padding:8px 12px;background:var(--amber-soft);font-size:14px}
pre.code{font-family:var(--mono);font-size:12.5px;background:var(--ink);border:1px solid var(--wire);padding:10px 12px;overflow-x:auto;margin:0;color:var(--paper)}
.formula{font-family:var(--mono);font-size:13.5px;background:var(--ink);border:1px solid var(--wire);padding:10px 12px;overflow-x:auto;color:var(--amber)}
ul.tight{margin:0;padding-left:18px}
ul.tight li+li{margin-top:4px}
.dots{display:flex;gap:6px}
.dots i{width:24px;height:4px;background:var(--wire)}
.dots i.on{background:var(--amber)}

.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 20px}
.sl label{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.sl label b{color:var(--paper)}
input[type=range]{width:100%;accent-color:var(--amber)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:1px;background:var(--wire);border:1px solid var(--wire);margin-block:14px}
.readout div{background:var(--ink);padding:10px}
.readout small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.readout b{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;width:100%;height:auto;min-width:420px}
.figcap{font-size:12px;color:var(--dim);font-family:var(--mono);margin-top:6px}
.shock{font-family:var(--mono);font-size:13px;border:1px solid var(--wire);padding:10px 12px;background:var(--ink)}
.shock td{padding:2px 10px 2px 0}

/* question */
.q{display:grid;gap:14px}
.vignette{font-size:16px;max-width:72ch}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;text-align:left;background:var(--deck-2);border:1px solid var(--wire);padding:11px 12px;cursor:pointer;border-radius:2px}
.opt .k{font-family:var(--display);font-weight:900;font-size:22px;line-height:1;color:var(--dim)}
.opt:hover{border-color:var(--dim)}
.opt.sel{border-color:var(--amber)}
.opt.sel .k{color:var(--amber)}
.opt.right{border-color:var(--bull);background:rgba(63,217,154,.08)}
.opt.right .k{color:var(--bull)}
.opt.wrong{border-color:var(--bear);background:rgba(255,99,99,.08)}
.opt.wrong .k{color:var(--bear)}
.opt .why{grid-column:2;font-size:13.5px;color:var(--dim);margin-top:4px}
.conf{display:grid;gap:6px;max-width:520px}
.conf label{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;color:var(--dim)}
.conf label b{color:var(--amber)}
.keys{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
kbd{font-family:var(--mono);font-size:12px;background:var(--deck-2);border:1px solid var(--wire);border-bottom-width:2px;padding:2px 7px;color:var(--paper)}
.verdict{font-family:var(--display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* play */
.desk{width:100%;border-collapse:collapse;font-size:13.5px}
.desk th,.desk td{border-bottom:1px solid var(--wire);padding:8px 8px;text-align:left;white-space:nowrap}
.desk th{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:400}
.desk td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.desk tr.pick{cursor:pointer}
.desk tr.pick:hover td{background:var(--deck-2)}
.tablewrap{overflow-x:auto}
.headline{font-family:var(--display);font-weight:800;font-size:clamp(22px,3.4vw,32px);text-transform:uppercase;line-height:1.05;border-left:4px solid var(--amber);padding-left:12px}
.inp{background:var(--ink);border:1px solid var(--wire);padding:8px 10px;font-family:var(--mono);font-size:15px;color:var(--paper);width:160px;border-radius:2px}
.inp:focus{border-color:var(--amber);outline:none}
.big{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.fcard{border:1px solid var(--wire);background:var(--deck);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fcard.got{border-color:var(--amber);box-shadow:inset 0 3px 0 var(--amber)}
.fcard.lock{opacity:.6}
.fcard .fname{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;line-height:1}

/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--wire);padding:8px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:400}
.tbl td.n{font-family:var(--mono);text-align:right}

/* calculator */
.calcwrap{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.calcwrap{grid-template-columns:1fr}}
.calc{background:#1B1D21;border:1px solid #2E3238;padding:16px;border-radius:10px;max-width:380px}
.lcd{background:#B8C2A6;color:#18200F;font-family:var(--mono);padding:10px 12px;border-radius:3px;min-height:72px;display:flex;flex-direction:column;justify-content:space-between}
.lcd .flags{font-size:10px;letter-spacing:.1em;display:flex;gap:10px;min-height:13px}
.lcd .val{font-size:28px;text-align:right;font-weight:600;overflow:hidden;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
.key{background:#2C3036;border:0;border-bottom:3px solid #15171A;color:#E9ECEF;padding:10px 0;border-radius:5px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer}
.key:active{transform:translateY(1px);border-bottom-width:2px}
.key.tvm{background:#3A3F47}
.key.second{background:#E8A11A;color:#1A1100;border-bottom-color:#8A5D05}
.key.cpt{background:#4B5563}
.key.num{background:#E7E9EC;color:#111;border-bottom-color:#9AA0A6}
.tape{font-family:var(--mono);font-size:12px;color:var(--dim);max-height:140px;overflow:auto;border:1px solid var(--wire);padding:8px;background:var(--ink)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--deck);border:1px solid var(--wire);max-width:620px;width:100%;padding:20px;display:grid;gap:12px;max-height:90vh;overflow:auto}
textarea{width:100%;min-height:120px;background:var(--ink);color:var(--paper);border:1px solid var(--wire);font-family:var(--mono);font-size:12px;padding:10px;resize:vertical}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:50;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--deck-2);border:1px solid var(--amber);padding:10px 14px;font-size:14px;animation:pop .25s ease-out}
.toast b{color:var(--amber);font-family:var(--display);text-transform:uppercase;font-size:17px;letter-spacing:.03em}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
.boss{height:14px;background:var(--wire);position:relative}
.boss i{position:absolute;inset:0 auto 0 0;background:var(--bear);transition:width .4s}
.timer{font-family:var(--mono);font-size:22px;font-weight:600}
.timer.low{color:var(--bear)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.nav{margin-left:0}.stats{gap:4px 12px}.xpbar{width:70px}}
</style>

<header class="bar"><div class="bar-in" id="bar"></div></header>
<main class="shell" id="main"></main>
<div id="modalRoot"></div>
<div id="toasts" aria-live="polite"></div>

<script>
/* =====================================================================
   WALL STREET QUEST — engine v0.1 (District 7: Bond Bridge)
   State lives in memory (S). Export/import moves it between sessions.
   ===================================================================== */

// ---------- curriculum map (official CFA L1 topic weight ranges, %) ----------
const DISTRICTS = [
  {id:1, name:"Compliance Court",       topic:"Ethics & Professional Standards", w:[15,20]},
  {id:2, name:"The Data Lab",           topic:"Quantitative Methods",           w:[6,9]},
  {id:3, name:"Central Bank War Room",  topic:"Economics",                      w:[6,9]},
  {id:4, name:"Forensic Accountant",    topic:"Financial Statement Analysis",   w:[11,14]},
  {id:5, name:"CFO's Desk",             topic:"Corporate Issuers",              w:[6,9]},
  {id:6, name:"Pitch Arena",            topic:"Equity Investments",             w:[11,14]},
  {id:7, name:"Bond Bridge",            topic:"Fixed Income",                   w:[11,14]},
  {id:8, name:"Options Casino",         topic:"Derivatives",                    w:[5,8]},
  {id:9, name:"The Vault",              topic:"Alternative Investments",        w:[7,10]},
  {id:10,name:"Fund Manager HQ",        topic:"Portfolio Management",           w:[8,12]},
];
const BUILT = [7];

const RANKS = [[0,"Intern"],[150,"Analyst I"],[400,"Analyst II"],[800,"Associate"],[1300,"Senior Associate"],[2000,"Vice President"],[3000,"Director"],[4200,"Managing Director"],[6000,"Charterholder"]];

// ---------- weak-spot tags (LOS-level) ----------
const TAGS = {
  "fi.price-yield":     {label:"Price–yield seesaw", los:"Explain the inverse price–yield relationship; identify premium, par and discount bonds"},
  "fi.bond-pricing":    {label:"Bond pricing", los:"Calculate a bond's price given a market discount rate"},
  "fi.current-yield":   {label:"Current yield", los:"Calculate and interpret current yield"},
  "fi.mod-duration":    {label:"Macaulay → modified duration", los:"Calculate modified duration from Macaulay duration"},
  "fi.duration-approx": {label:"Duration price estimate", los:"Estimate a bond's percentage price change using modified duration"},
  "fi.convexity":       {label:"Convexity adjustment", los:"Estimate price change using duration and convexity"},
  "fi.duration-drivers":{label:"What drives duration", los:"Explain how coupon, maturity and yield affect interest rate risk"},
  "fi.spreads":         {label:"Yield spreads & OAS", los:"Compare G-spread, I-spread, Z-spread and option-adjusted spread"},
  "fi.periodicity":     {label:"Semiannual pricing", los:"Price bonds with non-annual coupon periodicity"},
  "fi.duration-gap":    {label:"Horizon vs Macaulay duration", los:"Explain how investment horizon and Macaulay duration determine price vs reinvestment risk"},
};

// ---------- question bank: {id, topic, los, difficulty, vignette, options, answer, explanation, tag, keys?} ----------
const QUESTIONS = [
{ id:"fi-001", topic:7, tag:"fi.price-yield", difficulty:"easy",
  los:TAGS["fi.price-yield"].los,
  vignette:"Marta holds a 10-year bond issued last year with a 4.0% annual coupon. After a hot inflation report, yields on comparable bonds rise from 4.0% to 5.0%. Assuming nothing else changes, Marta's bond will now trade:",
  options:{A:"at a premium to par.", B:"at par.", C:"at a discount to par."},
  answer:"C",
  explanation:{
    A:"A premium needs the coupon to beat the market yield. Here the coupon (4%) is below the yield buyers now demand (5%), so the opposite happens.",
    B:"Par only holds while coupon rate = market yield. That was true at issue; the 1% rise broke it.",
    C:"Correct. Buyers want 5% but the bond pays 4%. The only way to deliver 5% is a lower price, so it trades below 100."
  }},
{ id:"fi-002", topic:7, tag:"fi.current-yield", difficulty:"easy",
  los:TAGS["fi.current-yield"].los,
  vignette:"A bond with a 5% annual coupon and 100 face value is quoted at a price of 95.00. Its current yield is closest to:",
  options:{A:"5.00%", B:"5.26%", C:"4.75%"},
  answer:"B",
  explanation:{
    A:"5.00% is the coupon rate (coupon ÷ face). Current yield divides by price, not face.",
    B:"Correct. Current yield = annual coupon ÷ price = 5 ÷ 95 = 5.26%.",
    C:"4.75% multiplies the coupon by the price ratio (5 × 0.95). The price belongs in the denominator."
  }},
{ id:"fi-003", topic:7, tag:"fi.mod-duration", difficulty:"easy",
  los:TAGS["fi.mod-duration"].los,
  vignette:"An analyst calculates a Macaulay duration of 7.20 years for an annual-pay bond with a yield-to-maturity of 6%. The bond's modified duration is closest to:",
  options:{A:"6.79", B:"7.20", C:"7.63"},
  answer:"A",
  explanation:{
    A:"Correct. ModDur = MacDur ÷ (1 + r) = 7.20 ÷ 1.06 = 6.79. Annual pay, so r is the full 6%.",
    B:"7.20 is the Macaulay duration itself. Modified duration always sits a little lower for a positive yield.",
    C:"7.63 multiplies by 1.06 instead of dividing."
  }},
{ id:"fi-004", topic:7, tag:"fi.bond-pricing", difficulty:"medium",
  los:TAGS["fi.bond-pricing"].los,
  vignette:"Kensington Rail issues a 3-year bond with a 6% annual coupon and 100 face value. Comparable bonds yield 5%. The bond's price is closest to:",
  options:{A:"97.38", B:"102.72", C:"103.00"},
  answer:"B",
  explanation:{
    A:"97.38 is the price at a 7% yield. When the coupon beats the yield, the bond must trade above par, not below.",
    B:"Correct. 6/1.05 + 6/1.05² + 106/1.05³ = 5.714 + 5.442 + 91.567 = 102.72.",
    C:"103.00 adds the extra 1% coupon for 3 years without discounting it. Future cash is worth less today, so the premium is smaller."
  },
  keys:["3 N","5 I/Y","6 PMT","100 FV","CPT PV → −102.72"]},
{ id:"fi-005", topic:7, tag:"fi.duration-approx", difficulty:"medium",
  los:TAGS["fi.duration-approx"].los,
  vignette:"A portfolio manager holds a bond priced at 104.00 with a modified duration of 8.5. If its yield-to-maturity rises by 50 basis points, the estimated new price using duration alone is closest to:",
  options:{A:"99.58", B:"99.75", C:"108.42"},
  answer:"A",
  explanation:{
    A:"Correct. %ΔP ≈ −8.5 × 0.005 = −4.25%. New price ≈ 104 × (1 − 0.0425) = 99.58.",
    B:"99.75 subtracts 4.25 points from 104. Duration gives a percentage of the current price (4.25% of 104 = 4.42), not price points.",
    C:"108.42 has the sign flipped. Higher yields mean lower prices."
  }},
{ id:"fi-006", topic:7, tag:"fi.duration-drivers", difficulty:"medium",
  los:TAGS["fi.duration-drivers"].los,
  vignette:"Three option-free bonds all yield 6%: Bond X is a 10-year 8% coupon; Bond Y is a 10-year 2% coupon; Bond Z is a 5-year 2% coupon. Which bond has the highest interest rate risk?",
  options:{A:"Bond X", B:"Bond Y", C:"Bond Z"},
  answer:"B",
  explanation:{
    A:"X has the same maturity as Y but a bigger coupon, so more of its value arrives early. That pulls duration down.",
    B:"Correct. Longest maturity plus lowest coupon pushes the most value to the final payment. The fulcrum sits furthest right, so duration is highest.",
    C:"Z has Y's low coupon but half the maturity. Shorter maturity means shorter duration."
  }},
{ id:"fi-007", topic:7, tag:"fi.duration-gap", difficulty:"medium",
  los:TAGS["fi.duration-gap"].los,
  vignette:"Jin buys a bond with a Macaulay duration of 9 years and plans to sell it in 6 years. Immediately after purchase, market yields rise by 100 bp and stay there. Which statement best describes Jin's position?",
  options:{
    A:"Reinvestment risk dominates, so his realized return rises above the original YTM.",
    B:"Price risk dominates, so his realized return falls below the original YTM.",
    C:"The two risks offset, so his realized return equals the original YTM."},
  answer:"B",
  explanation:{
    A:"Reinvestment gains win only when the horizon is longer than Macaulay duration. Jin sells early.",

// ---------- bond math ----------
function bond(c,y,n,f){
  const N=Math.max(1,Math.round(n*f)), r=y/f, cpn=100*c/f; let P=0,m=0,cx=0; const flows=[];
  for(let t=1;t<=N;t++){ const cf=cpn+(t===N?100:0), pv=cf/Math.pow(1+r,t); P+=pv; m+=t*pv; cx+=t*(t+1)*pv; flows.push({t:t/f,cf,pv}); }
  const mac=m/P/f; return {P, mac, mod:mac/(1+r), conv:cx/(P*Math.pow(1+r,2))/(f*f), flows};
}

// ---------- TVM solver (BA II Plus conventions: P/Y = C/Y = 1, END mode) ----------
function tvm(target, R){
  const {N,I,PV,PMT,FV}=R, i=I/100;
  const ann=(i,n)=>Math.abs(i)<1e-12? n : (1-Math.pow(1+i,-n))/i;
  const f=i=>PV+PMT*ann(i,N)+FV*Math.pow(1+i,-N);
  if(target==="PV") return -(PMT*ann(i,N)+FV*Math.pow(1+i,-N));
  if(target==="FV") return -(PV+PMT*ann(i,N))*Math.pow(1+i,N);
  if(target==="PMT") return -(PV+FV*Math.pow(1+i,-N))/ann(i,N);
  if(target==="N"){
    if(Math.abs(i)<1e-12) return PMT? -(PV+FV)/PMT : NaN;
    const v=(-PV-PMT/i)/(FV-PMT/i); return v>0? -Math.log(v)/Math.log(1+i) : NaN;
  }
  if(target==="I"){
    let lo=-0.99, hi=5, flo=f(lo), prev=lo, pf=flo, found=false;
    for(let k=1;k<=2000;k++){ const x=-0.99+k*(5.99/2000), fx=f(x); if(pf*fx<=0){lo=prev;hi=x;found=true;break;} prev=x;pf=fx; }
    if(!found) return NaN;
    for(let k=0;k<200;k++){ const m=(lo+hi)/2; if(f(lo)*f(m)<=0) hi=m; else lo=m; }
    return (lo+hi)/2*100;
  }
}

  const step=L.n<=10?1:L.n<=20?2:5; let ticks="";
  for(let t=0;t<=L.n;t+=step) ticks+=`<text x="${X(t)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--dim)" font-family="var(--mono)">${t}</text>`;
  const bars=b.flows.map(f=>{const h=Math.max(1.5,(f.pv/maxPV)*92); return `<rect x="${X(f.t)-bw/2}" y="${plank-4-h}" width="${bw}" height="${h}" fill="${f.cf>100?"var(--amber)":"var(--dim)"}" opacity="${f.cf>100?1:.75}"/>`;}).join("");
  const fx=X(b.mac);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Present value of cash flows balanced on Macaulay duration">
    ${bars}
    <rect x="${x0-6}" y="${plank-4}" width="${x1-x0+12}" height="5" fill="var(--paper)"/>
    <polygon points="${fx},${plank+2} ${fx-13},${plank+28} ${fx+13},${plank+28}" fill="var(--amber)"/>
    <line x1="${x0-6}" x2="${x1+6}" y1="${plank+28}" y2="${plank+28}" stroke="var(--wire)"/>
    <text x="${Math.min(Math.max(fx,80),x1-60)}" y="${plank+44}" text-anchor="middle" font-size="11" fill="var(--amber)" font-family="var(--mono)">MacDur ${fmt(b.mac)} yrs</text>
    ${ticks}
    <text x="${x1}" y="14" text-anchor="end" font-size="10" fill="var(--dim)" font-family="var(--mono)">years →</text>
  </svg>`;
}
function niceStep(r){ const s=[1,2,5,10,20,25,50,100,200]; return s.find(v=>r/v<=6)||500; }
function curveSVG(L,b){
  const W=560,H=280,ml=46,mr=14,mt=14,mb=32, ymax=0.16;
  const pts=[]; for(let k=1;k<=64;k++){ const y=k*0.0025; pts.push([y,bond(L.c,y,L.n,L.f).P]); }
  const a=Math.max(0.0025,L.y-0.02), z=Math.min(ymax,L.y+0.02), tan=y=>b.P*(1-b.mod*(y-L.y));
  let lo=Math.min(...pts.map(p=>p[1]),tan(z)), hi=Math.max(...pts.map(p=>p[1]),tan(a));
  const st=niceStep(hi-lo); lo=Math.max(0,Math.floor(lo/st)*st); hi=Math.ceil(hi/st)*st;
  const X=y=>ml+(y/ymax)*(W-ml-mr), Y=p=>mt+(hi-p)/(hi-lo)*(H-mt-mb);
  let grid=""; for(let p=lo;p<=hi+1e-9;p+=st) grid+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(p)}" y2="${Y(p)}" stroke="var(--wire)" stroke-width=".6"/><text x="${ml-6}" y="${Y(p)+3}" text-anchor="end" font-size="10" fill="var(--dim)" font-family="var(--mono)">${p}</text>`;
  for(let y=0;y<=ymax+1e-9;y+=0.02) grid+=`<text x="${X(y)}" y="${H-12}" text-anchor="middle" font-size="10" fill="var(--dim)" font-family="var(--mono)">${Math.round(y*100)}%</text>`;
  const path="M"+pts.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L");
  const seg=[]; for(let k=0;k<=24;k++){ const y=a+(z-a)*k/24; seg.push([y,bond(L.c,y,L.n,L.f).P]); }
  const gap="M"+seg.map(p=>`${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("L")+"L"+[...seg].reverse().map(p=>`${X(p[0]).toFixed(1)},${Y(tan(p[0])).toFixed(1)}`).join("L")+"Z";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Price–yield curve with duration tangent">
    ${grid}
    <line x1="${X(L.c)}" x2="${X(L.c)}" y1="${mt}" y2="${H-mb}" stroke="var(--wire)" stroke-dasharray="2 3"/>
    <text x="${X(L.c)+4}" y="${mt+10}" font-size="10" fill="var(--dim)" font-family="var(--mono)">coupon ${fmt(L.c*100,2)}%</text>
    <path d="${gap}" fill="var(--amber-soft)" stroke="none"/>
    <path d="${path}" fill="none" stroke="var(--paper)" stroke-width="2"/>
    <line x1="${X(a)}" y1="${Y(tan(a))}" x2="${X(z)}" y2="${Y(tan(z))}" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="5 4"/>
    <circle cx="${X(L.y)}" cy="${Y(b.P)}" r="5" fill="var(--amber)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${W-mr}" y="${H-1}" text-anchor="end" font-size="10" fill="var(--dim)" font-family="var(--mono)">yield-to-maturity →</text>
  </svg>`;
}

// ---------- TEST / shared question renderer ----------
function newRun(ids, mode){ return {mode, qs:ids, i:0, pick:null, conf:60, revealed:false, results:[], t0:Date.now()}; }
function confLabel(c){ return c<=40?"Guessing":c<=60?"Leaning":c<=85?"Fairly sure":"Certain"; }
function qHTML(q, run, feedback){
  const rev=run.revealed && feedback;
  const opts=Object.entries(q.options).map(([k,t])=>{
    let cls="opt"; if(run.pick===k) cls+=" sel";
    if(rev){ if(k===q.answer) cls="opt right"; else if(run.pick===k) cls="opt wrong"; }
    return `<button class="${cls}" data-act="qpick" data-k="${k}" ${run.revealed?"disabled":""}><span class="k">${k}</span><span>${t}</span>${rev?`<span class="why">${q.explanation[k]}</span>`:""}</button>`;
  }).join("");
  const last=run.results[run.results.length-1];
  return `<div class="q">
    <div class="qmeta"><span class="chip amber">Q${run.i+1} / ${run.qs.length}</span><span class="chip">${q.difficulty}</span><span class="chip">${TAGS[q.tag].label}</span></div>
    <p class="vignette">${q.vignette}</p>
    <div class="opts">${opts}</div>
    ${!run.revealed?`<div class="conf"><label for="confIn">How sure are you? <b id="confLbl">${run.conf}% · ${confLabel(run.conf)}</b></label>
      <input type="range" id="confIn" data-inp="conf" min="34" max="100" step="1" value="${run.conf}">
      <span class="dim" style="font-size:12px">34% = pure guess among three. Being right <em>and</em> calibrated scores best.</span></div>
      <div class="row"><button class="btn primary" data-act="qlock" ${run.pick?"":"disabled"}>Lock it in</button></div>`
    : feedback? `<div class="stack">
      <div class="verdict ${last.ok?"bull":"bear"}">${last.ok?"Correct":"Wrong"} <span class="mono dim" style="font-size:14px;text-transform:none">${last.xp?"+"+last.xp+" XP":"0 XP"} · confidence ${Math.round(last.c*100)}%</span></div>
      ${!last.ok && last.c>=.8?`<p class="bear">Confident and wrong. That's the expensive kind; this tag is now on your weak-spot list.</p>`:""}
      ${q.keys?`<div class="keys"><span class="eyebrow">BA II Plus</span>${q.keys.map(k=>`<kbd>${k}</kbd>`).join("")}</div>`:""}
      <div class="row"><button class="btn primary" data-act="qnext">${run.i<run.qs.length-1?"Next question":"See results"}</button></div></div>` : ""}
  </div>`;
}
function recordAnswer(q, pickK, conf, mode){
  const ok=pickK===q.answer, c=conf/100, cn=Math.max(0,(c-.34)/.66), mult={easy:1,medium:1.5,hard:2}[q.difficulty];
  let xp = ok? Math.round(10*mult*(.75+.75*cn)) : 0;
  if(ok){ S.streak++; S.bestStreak=Math.max(S.bestStreak,S.streak); if(S.streak%5===0){ xp+=10; toast("Streak ×"+S.streak,"+10 XP bonus. The floor is starting to notice."); } }
  else S.streak=0;
  S.log.push({q:q.id, ok, c, s:S.session, m:mode});
  const t=S.tags[q.tag]||{miss:0,hit:0,box:0,due:null,mastered:false};
  if(!ok){ t.miss++; t.box=0; t.due=S.session+1; t.mastered=false; }
  else { t.hit++; if(mode==="review"){ t.box++; if(t.box>=3){ t.mastered=true; t.due=null; } else t.due=S.session+[1,3,7][t.box]; } }
  if(!ok || S.tags[q.tag]) S.tags[q.tag]=t;
  addXP(xp); renderBar();
  return {ok, xp, c, q:q.id, tag:q.tag};
}

  const d=S.d[7];
  if(!UI.test || UI.test.mode!=="test"){
    return `<div class="panel stack"><span class="eyebrow">Bond Bridge · Test</span><h3>Ten vignettes. Three options each.</h3>
      <p>Pick an answer, set your confidence, lock it in. Wrong answers tag the concept for the Review Boss. Confident wrong answers cost the most calibration.</p>
      <table class="tbl" style="max-width:420px"><tbody><tr><td>Mix</td><td class="n">3 easy · 4 medium · 3 hard</td></tr><tr><td>Calculation items</td><td class="n">3 (with BA II Plus keys)</td></tr><tr><td>Best score</td><td class="n">${d.testBest==null?"—":pct(d.testBest)}</td></tr></tbody></table>
      <div class="row"><button class="btn primary" data-act="testStart">${d.tests?"Retake test":"Start test"}</button></div></div>`;
  }

function runSummary(run, title){
  const R=run.results, ok=R.filter(r=>r.ok).length, br=R.reduce((s,r)=>s+Math.pow(r.c-(r.ok?1:0),2),0)/Math.max(1,R.length);
  const missed=[...new Set(R.filter(r=>!r.ok).map(r=>r.tag))];
  return `<div class="panel stack"><span class="eyebrow">${title||"Test complete"}</span>
    <div class="row" style="gap:28px"><div><div class="big ${ok/R.length>=.7?"bull":"bear"}">${ok} / ${R.length}</div><span class="dim mono">score</span></div>
    <div><div class="big">${Math.round(100*(1-br))}</div><span class="dim mono">calibration</span></div>
    <div><div class="big amber">+${R.reduce((s,r)=>s+r.xp,0)}</div><span class="dim mono">XP</span></div></div>
    ${missed.length?`<div><b>Tagged for review:</b> ${missed.map(t=>`<span class="chip bear">${TAGS[t].label}</span>`).join(" ")}</div>`:`<p class="bull">Clean sheet. No new weak spots.</p>`}
    ${run.mode!=="test"? reviewList(run):""}
    <div class="row">${run.mode==="test"?`<button class="btn primary" data-act="testStart">Retake test</button>`:""}<button class="btn ${run.mode==="test"?"":"primary"}" data-act="go" data-v="hub">Back to the city</button>${missed.length?`<button class="btn" data-act="go" data-v="weak">See weak spots</button>`:""}</div></div>`;
}
function reviewList(run){
  return `<details><summary class="btn sm" style="display:inline-block">Review every answer</summary><div class="stack" style="margin-top:12px">${run.results.map((r,k)=>{const q=QUESTIONS.find(x=>x.id===r.q);
    return `<div class="panel" style="background:var(--ink)"><div class="qmeta"><span class="chip ${r.ok?"bull":"bear"}">${r.ok?"Right":"Wrong"}</span><span class="chip">${TAGS[q.tag].label}</span></div>
    <p style="margin-top:8px">${q.vignette}</p><p style="margin-top:6px">You: <b>${r.pick||"no answer"}</b> · Correct: <b class="bull">${q.answer}</b></p>
    <p class="dim" style="margin-top:6px">${q.explanation[q.answer]}</p></div>`;}).join("")}</div></details>`;
}

function calcKey(k){
  const C=calcState(), lbl={N:"N",I:"I/Y",PV:"PV",PMT:"PMT",FV:"FV"};
  C.tape.push({NEG:"+/−",I:"I/Y",CE:"CE/C",RN:"RCL N",RI:"RCL I/Y",RPV:"RCL PV",RFV:"RCL FV"}[k]||(k==="FV"&&C.second?"CLR-TVM":k));
  const cur=()=>parseFloat(C.disp)||0, show=v=>{ C.disp=isFinite(v)? String(Math.round(v*1e6)/1e6) : "Error"; C.entering=false; };
  if(/^[0-9]$/.test(k)||k==="."){ if(!C.entering){C.disp=k==="."?"0.":k;C.entering=true;C.label="";} else if(C.disp.length<12 && !(k==="."&&C.disp.includes("."))) C.disp+=k; return refreshCalc(); }
  if(k==="NEG"){ C.disp = C.disp.startsWith("-")? C.disp.slice(1) : (C.disp==="0"?"0":"-"+C.disp); return refreshCalc(); }
  if(k==="CE"){ C.disp="0"; C.entering=false; C.acc=null; C.op=null; C.label=""; C.second=false; C.cpt=false; return refreshCalc(); }
  if(k==="2ND"){ C.second=!C.second; return refreshCalc(); }
  if(k==="CPT"){ C.cpt=true; return refreshCalc(); }
  if(k==="ENTER"){ C.entering=false; return refreshCalc(); }
  if(["+","-","*","/"].includes(k)){ C.acc=cur(); C.op=k; C.entering=false; return refreshCalc(); }
  if(k==="="){ if(C.op!=null){ const a=C.acc,b=cur(); show({"+":a+b,"-":a-b,"*":a*b,"/":a/b}[C.op]); C.op=null; C.label=""; } return refreshCalc(); }
  if(k.startsWith("R")){ const r={RN:"N",RI:"I",RPV:"PV",RFV:"FV"}[k]; show(C.R[r]); C.label=lbl[r]; return refreshCalc(); }
  if(lbl[k]){
    if(k==="FV" && C.second){ C.R={N:0,I:0,PV:0,PMT:0,FV:0}; C.second=false; C.disp="0"; C.label=""; C.entering=false; return refreshCalc(); }
    C.second=false;
    if(C.cpt){ C.cpt=false; const v=tvm(k,C.R); C.R[k]=isFinite(v)?v:C.R[k]; show(v); C.label=lbl[k]; checkDrill(k,v); }
    else { C.R[k]=cur(); C.label=lbl[k]; C.entering=false; C.disp=String(C.R[k]); }
    return refreshCalc();
  }
}
function checkDrill(k,v){
  const C=calcState(), D=DRILLS[C.drill];
  if(k===D.target && isFinite(v) && Math.abs(v-D.ans) < (k==="I"?0.005:0.01)){
    if(!S.drills.includes(D.id)){ S.drills.push(D.id); addXP(20); toast("Drill cleared", D.title+" Answer "+fmt(v,2)+"."); }
  }
}

   EXAM MODE (timed, weighted by official topic weights)
   ===================================================================== */
let examTimer=null;
function examPlan(n){
  const avail=DISTRICTS.filter(d=>QUESTIONS.some(q=>q.topic===d.id));
  const tot=avail.reduce((s,d)=>s+(d.w[0]+d.w[1])/2,0);
  let alloc=avail.map(d=>({d, k:Math.round(n*((d.w[0]+d.w[1])/2)/tot)}));
  let diff=n-alloc.reduce((s,a)=>s+a.k,0); alloc.sort((a,b)=>(b.d.w[0]+b.d.w[1])-(a.d.w[0]+a.d.w[1]));
  for(let i=0; diff!==0 && alloc.length; i=(i+1)%alloc.length){ const st=Math.sign(diff); if(alloc[i].k+st>=0){ alloc[i].k+=st; diff-=st; } }
  let ids=[]; alloc.forEach(a=>{ ids=ids.concat(shuffle(QUESTIONS.filter(q=>q.topic===a.d.id)).slice(0,a.k).map(q=>q.id)); });
  return shuffle(ids);
}

    <p class="lede">Timed, no feedback until the end, questions drawn by the official topic weights from every district that's open. Run out the clock and the question counts as wrong.</p>
    <div class="panel tablewrap"><table class="tbl"><thead><tr><th>Topic</th><th>Official weight</th><th>Bank</th></tr></thead><tbody>
      ${DISTRICTS.map(d=>{const n=QUESTIONS.filter(q=>q.topic===d.id).length; return `<tr><td>${d.topic}</td><td class="n">${d.w[0]}–${d.w[1]}%</td><td class="n ${n?"amber":"dim"}">${n?n+" questions":"locked"}</td></tr>`;}).join("")}
    </tbody></table></div>

function examTick(){
  clearInterval(examTimer); const E=UI.exam; if(!E||E.i>=E.qs.length) return;
  examTimer=setInterval(()=>{ if(UI.view!=="exam"||!UI.exam){clearInterval(examTimer);return;} E.left--; const el=$("#timer"); if(el){ el.textContent=E.left+"s"; el.classList.toggle("low",E.left<=15); }
    if(E.left<=0){ lockAnswer(E,true); } },1000);
}

   ANSWER FLOW
   ===================================================================== */
function activeRun(){ return UI.view==="exam"?UI.exam : UI.view==="review"?UI.review : UI.test; }
function lockAnswer(run, timeout){
  const q=QUESTIONS.find(x=>x.id===run.qs[run.i]);
  const r=recordAnswer(q, run.pick, run.conf, run.mode); r.pick=run.pick; run.results.push(r);
  if(run.mode==="review"){ const dmg=100/run.qs.length*(r.ok?(1+(r.c-.34)):0) ; run.hp-=dmg; if(!r.ok && r.c>=.75) run.hp=Math.min(100,run.hp+12); }
  if(run.mode==="exam"){ run.i++; run.pick=null; run.left=90; if(timeout) toast("Time","Question counted as wrong."); render(); if(run.i<run.qs.length) examTick(); else finishRun(run); return; }
  run.revealed=true; render();
}
function finishRun(run){
  if(run.mode==="test"){ const d=S.d[7], sc=run.results.filter(r=>r.ok).length/run.results.length; d.tests++; d.testBest=Math.max(d.testBest||0,sc); if(sc>=.7) toast("District test passed",`${Math.round(sc*100)}%. Bond Bridge stands.`); }
  if(run.mode==="review" && run.hp<=0) addXP(40);
  renderBar();
}

  brief2:()=>{ const D=UI.play.desk, g=deskStats(D.base).find(s=>s.id==="g10"), v=num($("#b2").value); if(!isFinite(v)) return; const t=g.mod*1e3, ok=Math.abs(v-t)/t<=0.03; D.brief.q2={ok}; if(ok){ unlockCard("fi.pvbp"); addXP(10);} render(); },
  deskStart:()=>{ UI.play.desk.stage="pick"; render(); },
  deskPick:a=>{ const D=UI.play.desk, R=D.rounds[D.r]; R.choice=a.dataset.id; if(R.choice==="cash"){ settle(null); } else D.stage="est"; render(); },
  deskEst:()=>{ const v=num($("#estIn").value); if(!isFinite(v)) return toast("Enter a percentage","For example −4.25"); settle(v); render(); },
  deskNext:()=>{ const D=UI.play.desk; D.base=Math.max(0.0025,D.base+D.rounds[D.r].dy); D.r++; if(D.r>=5){ D.stage="end"; if(D.V>1e7 && !S.d[7].play){ S.d[7].play=true; addXP(100); toast("Play complete","You beat the desk. +100 XP"); } } else D.stage="pick"; render(); },
  deskNew:()=>{ UI.play.desk=newDesk(); UI.play.desk.stage="pick"; render(); },
  testStart:()=>{ UI.test=newRun(shuffle(QUESTIONS.filter(q=>q.topic===7)).map(q=>q.id),"test"); render(); },
  qpick:a=>{ const r=activeRun(); if(!r||r.revealed) return; r.pick=a.dataset.k; render(); },
  qlock:()=>{ const r=activeRun(); if(!r||!r.pick) return; lockAnswer(r); },
  qnext:()=>{ const r=activeRun(); r.i++; r.pick=null; r.revealed=false; if(r.i>=r.qs.length) finishRun(r); render(); window.scrollTo(0,0); },
  advance:()=>{ S.session++; toast("New day","Session "+S.session+". Some weak spots may now be due."); render(); },
  examStart:a=>{ UI.exam={...newRun(examPlan(+a.dataset.n),"exam"), left:90}; render(); examTick(); },
  drill:a=>{ calcState().drill=+a.dataset.i; refreshCalc(); },
  drillKeys:()=>{ const C=calcState(); C.show=!C.show; refreshCalc(); },
  key:a=>calcKey(a.dataset.k),
  save:()=>openSave(),
  closeModal:(a,e)=>{ if(e.target.closest("[data-stop]") && !e.target.closest(".btn")) return; $("#modalRoot").innerHTML=""; },
  copyCode:()=>{ const t=$("#expCode"); const done=()=>{$("#copyMsg").textContent="Copied";}; try{ navigator.clipboard.writeText(t.value).then(done,()=>{t.select();$("#copyMsg").textContent="Selected. Press Ctrl/⌘+C";}); }catch(e){ t.select(); $("#copyMsg").textContent="Selected. Press Ctrl/⌘+C"; } },
  doImport:()=>{ try{ importCode($("#impCode").value); render(); openSave({t:"Loaded. Session "+S.session+"."}); }catch(e){ openSave({t:"That code didn't load. Paste the full text starting with WSQ1.", bad:true}); } },
};
function settle(est){
  const D=UI.play.desk, R=D.rounds[D.r], st=deskStats(D.base), pos=st.find(s=>s.id===R.choice);
  let actual=0, durOnly=0, full=0;
  if(pos.id!=="cash"){ const P1=bond(pos.c,pos.y+R.dy,pos.n,pos.f).P; actual=(P1/pos.P-1)*100; durOnly=-pos.mod*R.dy*100; full=(-pos.mod*R.dy+0.5*pos.conv*R.dy*R.dy)*100; }
  const pnl=D.V*actual/100; D.V+=pnl;
  let ok=false;
  if(est!=null){
    ok = Math.abs(est-full)<=0.15 || Math.abs(est-durOnly)<=0.15;
    if(ok){ D.ok++; addXP(15); unlockCard("fi.durest"); }
    if(Math.abs(est-full)<=0.15 && Math.abs(full-durOnly)>0.30) unlockCard("fi.conv");
  }
  R.est=est; R.res={actual,durOnly,full,pnl,ok}; D.stage="res";
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="closeModal"){ ACT.closeModal(a,e); return; }
  e.stopPropagation(); const f=ACT[a.dataset.act]; if(f) f(a,e);
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.inp==="lab"){ const k=el.dataset.k, v=+el.value; UI.lab[k]= k==="n"? v : v/100; $("#slv-"+k).textContent=fmt(v,k==="n"?0:2)+(k==="n"?" yrs":"%"); updateLab(); }
  if(el.dataset.inp==="conf"){ const r=activeRun(); if(r){ r.conf=+el.value; $("#confLbl").textContent=r.conf+"% · "+confLabel(r.conf); } }
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter") return; const id=e.target.id;
  const map={boothIn:"boothQuote",b1:"brief1",b2:"brief2",estIn:"deskEst"}; if(map[id]) ACT[map[id]]();
});
window.addEventListener("resize",()=>{ if(UI.view==="hub") drawSky(); });

// boot (keeps state across live updates of this page)
function start(data){ if(data && data.S && data.S.v===1) S=data.S; render(); }
try{ window.claude?.hot?.snapshot?.(()=>({S})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
